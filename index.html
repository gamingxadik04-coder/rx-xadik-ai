 <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RX XADIK AI — Cognitive Assistant</title>
<style>
  :root {
    --bg-main: #060b08;
    --bg-sidebar: #0b130f;
    --bg-surface: #0f1a14;
    --bg-surface-hover: #15241c;
    --bg-user-msg: #143623;
    --bg-ai-msg: #0c1510;
    --border-color: #1e3d2b;
    --border-glow: #285c3e;
    --accent: #22c55e;
    --accent-bright: #54ff91;
    --accent-soft: rgba(84, 255, 145, 0.12);
    --text-primary: #eaffef;
    --text-secondary: #95b3a1;
    --text-muted: #678272;
    --danger: #ff5c6c;
    --sidebar-width: 280px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    overflow: hidden;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #1d3b2a;
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #2b593f;
  }

  /* App Layout */
  .layout {
    display: flex;
    height: 100dvh;
    width: 100%;
    position: relative;
    background:
      radial-gradient(circle at 80% 10%, rgba(34, 197, 94, 0.08), transparent 40%),
      radial-gradient(circle at 20% 90%, rgba(84, 255, 145, 0.05), transparent 45%),
      var(--bg-main);
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    z-index: 30;
    transition: transform 0.28s ease;
  }

  .sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid rgba(30, 61, 43, 0.65);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .brand-orb {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(84, 255, 145, 0.22), rgba(25, 184, 91, 0.08));
    border: 1px solid var(--border-glow);
    display: grid;
    place-items: center;
    color: var(--accent-bright);
    font-weight: 800;
    font-size: 16px;
    box-shadow: 0 0 18px rgba(84, 255, 145, 0.14);
  }

  .brand-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: var(--accent-bright);
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.4px;
  }

  .new-chat-btn {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border-glow);
    background: linear-gradient(135deg, #169c4e, #127a3d);
    color: #f3fff7;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(25, 184, 91, 0.18);
  }

  .new-chat-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .history-section-title {
    padding: 14px 18px 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.9px;
    color: var(--text-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 11px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.18s ease;
    font-size: 13px;
  }

  .history-item:hover {
    background: var(--bg-surface-hover);
    color: var(--text-primary);
  }

  .history-item.active {
    background: var(--accent-soft);
    border-color: var(--border-glow);
    color: var(--accent-bright);
    font-weight: 600;
  }

  .history-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left;
  }

  .delete-chat-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    padding: 3px 6px;
    border-radius: 6px;
    cursor: pointer;
    opacity: 0.7;
    transition: all 0.15s ease;
  }

  .delete-chat-btn:hover {
    opacity: 1;
    color: var(--danger);
    background: rgba(255, 92, 108, 0.12);
  }

  .sidebar-footer {
    padding: 12px 14px;
    border-top: 1px solid rgba(30, 61, 43, 0.65);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .footer-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .clear-all-btn {
    width: 100%;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255, 92, 108, 0.25);
    background: rgba(255, 92, 108, 0.06);
    color: #ff8e99;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .clear-all-btn:hover {
    background: rgba(255, 92, 108, 0.14);
  }

  /* Mobile Backdrop */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(2px);
    z-index: 25;
  }

  /* Main Chat Area */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100dvh;
  }

  /* Topbar */
  .topbar {
    height: 62px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border-color);
    background: rgba(11, 19, 15, 0.85);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .menu-btn {
    display: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-size: 18px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }

  .active-chat-label {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--accent-bright);
    white-space: nowrap;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-bright);
    box-shadow: 0 0 8px var(--accent-bright);
  }

  .status-pill.listening .status-dot {
    background: #ff6b6b;
    box-shadow: 0 0 10px #ff6b6b;
    animation: pulse 1s infinite;
  }

  .status-pill.thinking .status-dot {
    background: #facc15;
    box-shadow: 0 0 10px #facc15;
    animation: pulse 1s infinite;
  }

  .status-pill.error .status-dot {
    background: var(--danger);
    box-shadow: 0 0 10px var(--danger);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.65; }
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tts-toggle-btn {
    padding: 7px 11px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.18s ease;
  }

  .tts-toggle-btn.active {
    border-color: var(--border-glow);
    background: var(--accent-soft);
    color: var(--accent-bright);
  }

  /* Messages Container */
  .messages-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px 18px 32px;
    scroll-behavior: smooth;
  }

  .messages-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Welcome Hero */
  .welcome-card {
    margin: 24px auto;
    max-width: 620px;
    background: linear-gradient(180deg, rgba(16, 28, 21, 0.9), rgba(10, 18, 13, 0.95));
    border: 1px solid var(--border-color);
    border-radius: 22px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), 0 0 30px rgba(84, 255, 145, 0.06);
  }

  .welcome-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid var(--border-glow);
    color: var(--accent-bright);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  .welcome-card h2 {
    font-size: 24px;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .welcome-card p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .quick-prompts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    text-align: left;
  }

  .prompt-chip {
    padding: 12px 14px;
    border-radius: 13px;
    border: 1px solid var(--border-color);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .prompt-chip:hover {
    border-color: var(--border-glow);
    background: var(--bg-surface-hover);
    transform: translateY(-1px);
  }

  /* Message Row */
  .message-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: fadeIn 0.22s ease;
  }

  .message-row.user {
    flex-direction: row-reverse;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .avatar.ai {
    background: linear-gradient(135deg, rgba(84, 255, 145, 0.2), rgba(25, 184, 91, 0.1));
    border: 1px solid var(--border-glow);
    color: var(--accent-bright);
  }

  .avatar.user {
    background: #1b4b30;
    border: 1px solid #2e784e;
    color: #eaffef;
  }

  .bubble-wrap {
    max-width: min(82%, 680px);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .message-row.user .bubble-wrap {
    align-items: flex-end;
  }

  .bubble {
    padding: 14px 16px;
    border-radius: 16px;
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .message-row.ai .bubble {
    background: var(--bg-ai-msg);
    border: 1px solid var(--border-color);
    border-top-left-radius: 4px;
    color: var(--text-primary);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  .message-row.user .bubble {
    background: var(--bg-user-msg);
    border: 1px solid #296b45;
    border-top-right-radius: 4px;
    color: #f2fff6;
  }

  .typing-cursor::after {
    content: "▍";
    display: inline-block;
    margin-left: 2px;
    color: var(--accent-bright);
    animation: blink 0.8s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .bubble-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px;
  }

  .action-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
  }

  .action-btn:hover {
    color: var(--accent-bright);
    background: var(--accent-soft);
    border-color: rgba(84, 255, 145, 0.2);
  }

  .action-btn.copied {
    color: var(--accent-bright);
  }

  /* Composer */
  .composer-wrap {
    padding: 12px 18px 18px;
    background: linear-gradient(180deg, rgba(6, 11, 8, 0), rgba(6, 11, 8, 0.92) 30%, var(--bg-main));
    flex-shrink: 0;
  }

  .composer-box {
    max-width: 860px;
    margin: 0 auto;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 10px 12px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .composer-box:focus-within {
    border-color: var(--border-glow);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45), 0 0 0 3px rgba(84, 255, 145, 0.08);
  }

  textarea#message {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 150px;
    min-height: 24px;
    resize: none;
    padding: 6px 4px;
  }

  textarea#message::placeholder {
    color: var(--text-muted);
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: #122118;
    color: var(--text-primary);
    font-size: 17px;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.18s ease;
  }

  .icon-btn:hover:not(:disabled) {
    border-color: var(--border-glow);
    background: var(--bg-surface-hover);
    color: var(--accent-bright);
  }

  .icon-btn.listening {
    background: rgba(255, 92, 108, 0.18);
    border-color: var(--danger);
    color: #ff8e99;
    animation: pulse 1.1s infinite;
  }

  .send-btn {
    height: 40px;
    padding: 0 16px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #22c55e, #159947);
    color: #04150a;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.18s ease;
  }

  .send-btn:hover:not(:disabled) {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .icon-btn:disabled,
  .send-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  .composer-hint {
    max-width: 860px;
    margin: 8px auto 0;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  /* Responsive Design */
  @media (max-width: 820px) {
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-backdrop.show {
      display: block;
    }

    .menu-btn {
      display: inline-flex;
    }

    .quick-prompts {
      grid-template-columns: 1fr;
    }

    .bubble-wrap {
      max-width: 88%;
    }
  }

  @media (max-width: 480px) {
    .topbar {
      padding: 0 12px;
    }

    .status-pill {
      padding: 4px 9px;
      font-size: 11px;
    }

    .tts-toggle-btn span.label {
      display: none;
    }

    .send-btn span.send-text {
      display: none;
    }

    .send-btn {
      width: 40px;
      padding: 0;
      justify-content: center;
    }

    .messages-wrap {
      padding: 16px 12px 24px;
    }

    .composer-wrap {
      padding: 10px 12px 14px;
    }
  }
</style>
</head>
<body>
<div class="layout">
  <!-- Mobile Sidebar Backdrop -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="Chat History Sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-orb">RX</div>
        <div>
          <div class="brand-title">RX XADIK AI</div>
          <div class="brand-sub">COGNITIVE ASSISTANT</div>
        </div>
      </div>
      <button class="new-chat-btn" type="button" onclick="createNewChat()">
        <span>＋</span>
        <span>New Chat</span>
      </button>
    </div>

    <div class="history-section-title">
      <span>Chat History</span>
      <span id="chatCount">0</span>
    </div>

    <div class="history-list" id="historyList"></div>

    <div class="sidebar-footer">
      <div class="footer-meta">
        <span>Gemini Backend</span>
        <span>v2.0 Premium UI</span>
      </div>
      <button class="clear-all-btn" type="button" onclick="clearAllHistory()">
        Clear All History
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" type="button" onclick="toggleSidebar()" aria-label="Toggle Menu">☰</button>
        <div class="active-chat-label" id="activeChatTitle">New Conversation</div>
      </div>

      <div class="topbar-right">
        <button class="tts-toggle-btn active" id="ttsToggleBtn" type="button" onclick="toggleAutoSpeak()" title="Toggle Voice Output">
          <span>🔊</span>
          <span class="label">Voice On</span>
        </button>
        <div class="status-pill" id="statusPill" role="status">
          <span class="status-dot"></span>
          <span id="statusText">Assistant Ready</span>
        </div>
      </div>
    </header>

    <section class="messages-wrap" id="messagesWrap">
      <div class="messages-inner" id="messagesInner"></div>
    </section>

    <div class="composer-wrap">
      <div class="composer-box">
        <button class="icon-btn" id="micButton" type="button" onclick="listen()" aria-label="Speak to RX XADIK AI" title="Voice Input (bn-BD)">
          🎙
        </button>
        <textarea
          id="message"
          rows="1"
          placeholder="RX XADIK AI-কে মেসেজ লিখুন অথবা মাইক্রোফোনে বলুন..."
          aria-label="Your message"
        ></textarea>
        <button class="send-btn" id="sendButton" type="button" onclick="sendMessage()" aria-label="Send Message">
          <span>➤</span>
          <span class="send-text">Send</span>
        </button>
      </div>
      <div class="composer-hint">
        Enter চাপলে মেসেজ যাবে • Shift + Enter দিয়ে নতুন লাইন • RX XADIK AI • Version 2.0
      </div>
    </div>
  </main>
</div>

<script>
const STORAGE_KEY = "rx_xadik_ai_chats_v1";

const messageInput = document.getElementById("message");
const messagesWrap = document.getElementById("messagesWrap");
const messagesInner = document.getElementById("messagesInner");
const historyList = document.getElementById("historyList");
const chatCount = document.getElementById("chatCount");
const activeChatTitle = document.getElementById("activeChatTitle");
const statusPill = document.getElementById("statusPill");
const statusText = document.getElementById("statusText");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const ttsToggleBtn = document.getElementById("ttsToggleBtn");
const sidebar = document.getElementById("sidebar");
const sidebarBackdrop = document.getElementById("sidebarBackdrop");

let chats = [];
let activeChatId = null;
let isBusy = false;
let autoSpeak = true;

function setStatus(text, mode = "ready") {
  statusText.textContent = text;
  statusPill.className = "status-pill";
  if (mode !== "ready") {
    statusPill.classList.add(mode);
  }
}

function toggleSidebar(forceState) {
  const shouldOpen = typeof forceState === "boolean" ? forceState : !sidebar.classList.contains("open");
  sidebar.classList.toggle("open", shouldOpen);
  sidebarBackdrop.classList.toggle("show", shouldOpen);
}

function toggleAutoSpeak() {
  autoSpeak = !autoSpeak;
  ttsToggleBtn.classList.toggle("active", autoSpeak);
  ttsToggleBtn.querySelector(".label").textContent = autoSpeak ? "Voice On" : "Voice Off";
  ttsToggleBtn.querySelector("span").textContent = autoSpeak ? "🔊" : "🔇";
  if (!autoSpeak && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

function speak(text) {
  if (!autoSpeak || !("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "bn-BD";
  utterance.rate = 1;
  speechSynthesis.speak(utterance);
}

function saveChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  } catch (err) {
    console.error("Failed to save chats:", err);
  }
}

function loadChats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        chats = parsed;
        activeChatId = chats[0].id;
        return;
      }
    }
  } catch (err) {
    console.error("Failed to load chats:", err);
  }
  createNewChat(false);
}

function createNewChat(shouldFocus = true) {
  if (isBusy) return;
  const newChat = {
    id: "chat_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
    title: "New Conversation",
    messages: [],
    updatedAt: Date.now()
  };
  chats.unshift(newChat);
  activeChatId = newChat.id;
  saveChats();
  renderSidebar();
  renderMessages();
  toggleSidebar(false);
  if (shouldFocus) messageInput.focus();
}

function selectChat(id) {
  if (isBusy || id === activeChatId) return;
  activeChatId = id;
  renderSidebar();
  renderMessages();
  toggleSidebar(false);
}

function deleteChat(event, id) {
  event.stopPropagation();
  if (isBusy) return;
  chats = chats.filter(c => c.id !== id);
  if (chats.length === 0) {
    createNewChat(false);
    return;
  }
  if (activeChatId === id) {
    activeChatId = chats[0].id;
  }
  saveChats();
  renderSidebar();
  renderMessages();
}

function clearAllHistory() {
  if (isBusy) return;
  localStorage.removeItem(STORAGE_KEY);
  chats = [];
  createNewChat(false);
}

function getActiveChat() {
  return chats.find(c => c.id === activeChatId) || chats[0];
}

function renderSidebar() {
  historyList.innerHTML = "";
  chatCount.textContent = chats.length;

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item" + (chat.id === activeChatId ? " active" : "");
    item.onclick = () => selectChat(chat.id);

    const titleSpan = document.createElement("span");
    titleSpan.className = "history-title";
    titleSpan.textContent = chat.title || "New Conversation";

    const delBtn = document.createElement("button");
    delBtn.className = "delete-chat-btn";
    delBtn.type = "button";
    delBtn.title = "Delete chat";
    delBtn.textContent = "✕";
    delBtn.onclick = (e) => deleteChat(e, chat.id);

    item.appendChild(titleSpan);
    item.appendChild(delBtn);
    historyList.appendChild(item);
  });

  const current = getActiveChat();
  activeChatTitle.textContent = current ? current.title : "New Conversation";
}

function createCopyButton(getTextFn) {
  const btn = document.createElement("button");
  btn.className = "action-btn";
  btn.type = "button";
  btn.innerHTML = `<span>📋</span><span>Copy</span>`;

  btn.onclick = async () => {
    const content = getTextFn();
    if (!content) return;
    try {
      await navigator.clipboard.writeText(content);
      btn.classList.add("copied");
      btn.innerHTML = `<span>✓</span><span>Copied</span>`;
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.innerHTML = `<span>📋</span><span>Copy</span>`;
      }, 1600);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = content;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      btn.innerHTML = `<span>✓</span><span>Copied</span>`;
      setTimeout(() => {
        btn.innerHTML = `<span>📋</span><span>Copy</span>`;
      }, 1600);
    }
  };
  return btn;
}

function appendMessageElement(role, text, animateTyping = false) {
  const row = document.createElement("div");
  row.className = `message-row ${role}`;

  const avatar = document.createElement("div");
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === "ai" ? "RX" : "YOU";

  const bubbleWrap = document.createElement("div");
  bubbleWrap.className = "bubble-wrap";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (!animateTyping) {
    bubble.textContent = text;
  }

  bubbleWrap.appendChild(bubble);

  if (role === "ai") {
    const actions = document.createElement("div");
    actions.className = "bubble-actions";
    actions.appendChild(createCopyButton(() => bubble.textContent));
    bubbleWrap.appendChild(actions);
  }

  row.appendChild(avatar);
  row.appendChild(bubbleWrap);
  messagesInner.appendChild(row);
  scrollToBottom();

  return bubble;
}

function renderWelcomeScreen() {
  const card = document.createElement("div");
  card.className = "welcome-card";
  card.innerHTML = `
    <div class="welcome-badge">RX XADIK AI • PREMIUM INTERFACE</div>
    <h2>আমি RX XADIK AI, কীভাবে সাহায্য করতে পারি?</h2>
    <p>আপনি নিচে মেসেজ লিখতে পারেন অথবা ভয়েস বাটন চাপ দিয়ে কথা বলতে পারেন। আপনার সব চ্যাট হিস্টোরি ব্রাউজারে সেভ থাকবে।</p>
    <div class="quick-prompts">
      <button class="prompt-chip" type="button" onclick="useQuickPrompt('আজকের একটি দারুণ মোটিভেশনাল কথা বলো')">
        ✨ আজকের একটি দারুণ মোটিভেশনাল কথা বলো
      </button>
      <button class="prompt-chip" type="button" onclick="useQuickPrompt('YouTube Shorts viral করার ৫টি কার্যকরী টিপস দাও')">
        🎬 YouTube Shorts viral করার ৫টি কার্যকরী টিপস দাও
      </button>
      <button class="prompt-chip" type="button" onclick="useQuickPrompt('JavaScript async/await সহজ ভাষায় বুঝিয়ে বলো')">
        💻 JavaScript async/await সহজ ভাষায় বুঝিয়ে বলো
      </button>
      <button class="prompt-chip" type="button" onclick="useQuickPrompt('আজকের দিনের একটি প্রোডাক্টিভ রুটিন তৈরি করে দাও')">
        📅 আজকের দিনের একটি প্রোডাক্টিভ রুটিন তৈরি করে দাও
      </button>
    </div>
  `;
  messagesInner.appendChild(card);
}

function useQuickPrompt(promptText) {
  if (isBusy) return;
  messageInput.value = promptText;
  autoResizeTextarea();
  sendMessage();
}

function renderMessages() {
  messagesInner.innerHTML = "";
  const currentChat = getActiveChat();

  if (!currentChat || !currentChat.messages || currentChat.messages.length === 0) {
    renderWelcomeScreen();
    return;
  }

  currentChat.messages.forEach(msg => {
    appendMessageElement(msg.role, msg.content, false);
  });

  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesWrap.scrollTop = messagesWrap.scrollHeight;
  });
}

function typeWriterEffect(bubbleEl, fullText) {
  return new Promise(resolve => {
    bubbleEl.textContent = "";
    bubbleEl.classList.add("typing-cursor");

    let index = 0;
    const totalLength = fullText.length;
    const stepSize = totalLength > 500 ? 4 : totalLength > 200 ? 2 : 1;
    const delay = totalLength > 500 ? 8 : 14;

    function step() {
      if (index < totalLength) {
        bubbleEl.textContent += fullText.slice(index, index + stepSize);
        index += stepSize;
        scrollToBottom();
        setTimeout(step, delay);
      } else {
        bubbleEl.textContent = fullText;
        bubbleEl.classList.remove("typing-cursor");
        scrollToBottom();
        resolve();
      }
    }

    step();
  });
}

function setControlsDisabled(disabled) {
  isBusy = disabled;
  sendButton.disabled = disabled;
  micButton.disabled = disabled;
  messageInput.disabled = disabled;
}

async function sendMessage() {
  if (isBusy) return;

  const text = messageInput.value.trim();
  if (!text) {
    setStatus("Please type a message first.", "ready");
    messageInput.focus();
    return;
  }

  const chat = getActiveChat();
  if (chat.messages.length === 0) {
    renderMessages();
    messagesInner.innerHTML = "";
  }

  // Update chat title from first message
  if (chat.messages.length === 0) {
    chat.title = text.length > 32 ? text.slice(0, 32) + "..." : text;
    renderSidebar();
  }

  chat.messages.push({ role: "user", content: text });
  chat.updatedAt = Date.now();
  appendMessageElement("user", text, false);

  messageInput.value = "";
  autoResizeTextarea();
  saveChats();

  setControlsDisabled(true);
  setStatus("RX XADIK AI is thinking...", "thinking");

  const aiBubble = appendMessageElement("ai", "", true);
  aiBubble.textContent = "Connecting to Gemini AI...";
  aiBubble.classList.add("typing-cursor");
  scrollToBottom();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || `Request failed (${response.status})`);
    }

    const aiReply = data.reply || "AI returned an empty response.";
    await typeWriterEffect(aiBubble, aiReply);

    chat.messages.push({ role: "ai", content: aiReply });
    chat.updatedAt = Date.now();
    saveChats();

    setStatus("AI Response Received", "ready");
    speak(aiReply);
  } catch (error) {
    console.error("Chat request failed:", error);
    const errMsg = "দুঃখিত, AI-এর সঙ্গে সংযোগ করা যাচ্ছে না। Backend চালু আছে কি না দেখুন এবং আবার চেষ্টা করুন।";
    aiBubble.classList.remove("typing-cursor");
    aiBubble.textContent = errMsg;
    setStatus("Connection Error", "error");
  } finally {
    setControlsDisabled(false);
    messageInput.focus();
  }
}

function autoResizeTextarea() {
  messageInput.style.height = "auto";
  messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + "px";
}

messageInput.addEventListener("input", autoResizeTextarea);

messageInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function listen() {
  if (isBusy) return;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setStatus("Voice recognition is not supported in this browser.", "error");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "bn-BD";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  micButton.classList.add("listening");
  setStatus("Listening...", "listening");

  recognition.onresult = function (event) {
    const transcript = event.results[0][0].transcript;
    messageInput.value = transcript;
    autoResizeTextarea();
    micButton.classList.remove("listening");
    setStatus("Voice captured. Sending to AI...", "thinking");
    sendMessage();
  };

  recognition.onerror = function (event) {
    micButton.classList.remove("listening");
    setStatus("Voice error: " + event.error, "error");
  };

  recognition.onend = function () {
    micButton.classList.remove("listening");
    if (statusText.textContent === "Listening...") {
      setStatus("Assistant Ready", "ready");
    }
  };

  try {
    recognition.start();
  } catch (error) {
    micButton.classList.remove("listening");
    setStatus("Microphone is already active. Try again.", "error");
  }
}

// Initialize App
loadChats();
renderSidebar();
renderMessages();
setStatus("Assistant Ready", "ready");
</script>
</body>
</html>
